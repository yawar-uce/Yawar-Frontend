name: ci

on:
  pull_request:
    branches: [dev, qa, production]
  push:
    branches: [dev, qa, production]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan with gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --verbose

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint, test and build every app
        run: |
          shopt -s nullglob
          apps=(apps/*/package.json)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "No apps yet — nothing to build"; exit 0
          fi
          for pkg in "${apps[@]}"; do
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm run lint --if-present && npm test --if-present && npm run build)
            echo "::endgroup::"
          done

      - name: Trivy filesystem scan (V-03)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
